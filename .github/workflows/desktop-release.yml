name: Desktop release

# Builds native installers for Windows (.exe/.msi) and Linux (.deb/.rpm/.AppImage) on each platform's
# own runner (Tauri apps aren't reliably cross-compiled). macOS isn't shipped; phones use the PWA
# (docs/IPHONE_APP.md).
#
# - a version bump merged to the default branch (package.json changes `version` and no `v<version>`
#   tag exists yet): the `plan` job detects it and the release below runs for that version; the
#   release step creates the tag at the merged commit. (A tag created by a workflow with GITHUB_TOKEN
#   wouldn't start any other workflow, so this workflow reacts to the push itself instead.)
# - a manually pushed `v*` tag — either published from GitHub's web UI (Releases → Draft a new release → new
#   tag `vX.Y.Z` → Publish) or pushed with `git tag vX.Y.Z && git push origin vX.Y.Z`: first checks
#   the tag matches the app version and that typecheck + tests pass, then builds, signs, and attaches
#   the installers *and* the signed `latest.json` manifest the in-app updater polls
#   (src-tauri/tauri.conf.json's plugins.updater.endpoints) to that tag's GitHub Release (created if
#   it doesn't exist yet) in the separate public releases repository RELEASES_REPO, so this
#   repository can be private. This is what makes "check for updates" inside the app find the new version.
# - the `publish` job then tags this repository's commit (the planner looks for that tag, so a
#   version is released once) and, while the repository variable MIRROR_RELEASES_TO_THIS_REPO is
#   `true` (the transition, docs/DESKTOP_RELEASES.md), copies the release into this repository's
#   Releases too, where the apps installed before the switch still look.
# - "Run workflow" from the Actions tab: build-only smoke test, no release, no signing. Installers
#   are attached to the run as downloadable artifacts (Summary tab) so it also works before the
#   signing secrets below are configured.
#
# One-time setup for the auto-updater to work (see docs/DESKTOP_RELEASES.md):
#   Settings → Secrets and variables → Actions → New repository secret
#     TAURI_SIGNING_PRIVATE_KEY          (the private half of src-tauri/updater.key)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the password chosen when it was generated)
#     RELEASES_REPO_TOKEN                (a fine-grained token: Contents read/write on RELEASES_REPO only)
on:
  push:
    tags:
      - 'v*'
    # The default branch (it's not `main`; if it is renamed, rename it here too).
    branches:
      - claude/pokemon-team-builder-otextg
    paths:
      - package.json
  workflow_dispatch:

env:
  RELEASES_REPO: Mernhil/pokemon-team-builder-releases

# Least privilege by default; only the release job may write (to publish the GitHub Release).
# Third-party actions are pinned to commit SHAs: the release job holds the updater signing key.
permissions:
  contents: read

# Never run two release builds for the same tag at once (they'd race on the release's assets).
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this push is a release and for which tag: a `v*` tag push always is; a push to
  # the default branch is one only when package.json's version has no tag yet (so edits to
  # package.json that don't bump the version, and re-pushes after a release, do nothing).
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Is there a release to make?
        id: plan
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
            release=true
          else
            tag="v$(node -p "require('./package.json').version")"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists: nothing to release."
              release=false
            else
              echo "No tag $tag yet: releasing it."
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Release: refuse to ship if the tag doesn't match the app version or the checks fail — a
  # mismatched tag would publish a latest.json advertising the wrong version to every installed app.
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches the app version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG tauri.conf.json=$tauri Cargo.toml=$cargo package.json=$pkg"
          if [ "$TAG" != "v$tauri" ] || [ "$cargo" != "$tauri" ] || [ "$pkg" != "$tauri" ]; then
            echo "::error::Tag $TAG doesn't match the app version ($tauri). Run 'npm run bump -- <version>', commit, and tag that commit."
            exit 1
          fi

      - name: The releases repository token is set
        env:
          TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The secret RELEASES_REPO_TOKEN is missing: releases are published to $RELEASES_REPO (docs/DESKTOP_RELEASES.md)."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Build, sign, and publish/update the GitHub Release the updater polls (creating the tag if needed).
  release:
    needs: [plan, verify]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      # The release text: this version's section of CHANGELOG.md ("## 0.7.0 — …" up to the next "## ").
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          v="${TAG#v}"
          notes=$(awk -v v="$v" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)
          { echo 'body<<EOF_RELEASE_NOTES'; echo "${notes:-See CHANGELOG.md.}"; echo 'EOF_RELEASE_NOTES'; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          # Publishes to the releases repository, so the token is the one scoped to it.
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Mernhil
          repo: pokemon-team-builder-releases
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: 'Pokémon Team Builder ${{ needs.plan.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # Tags this repository's commit and, during the transition, mirrors the release into this repository.
  publish:
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # The release itself lives in RELEASES_REPO, so this repository gets its tag here: without it
      # the next push that touches package.json would release the same version again.
      - name: Tag this commit
        if: github.ref_type != 'tag'
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" || echo "Tag $TAG already exists."

      # Apps installed before the switch poll this repository's latest.json. Its installer links
      # point at RELEASES_REPO's public assets. Turn it off once both installed apps have updated.
      - name: Mirror the release into this repository (transition)
        if: vars.MIRROR_RELEASES_TO_THIS_REPO == 'true'
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$RELEASES_REPO" --dir assets
          gh release view "$TAG" --repo "$RELEASES_REPO" --json body --jq .body > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "Pokémon Team Builder $TAG" --notes-file notes.md
          fi

  # Manual "Run workflow": build only, no signing, no release — just proves the pipeline works.
  build-test:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      # Updater artifacts need the signing key, which a test run doesn't have (and doesn't need):
      # src-tauri/tauri.test.conf.json turns them off for this build only. Tag releases don't use it.
      - name: Build only (manual test run)
        run: npx tauri build --config src-tauri/tauri.test.conf.json

      - name: Upload build (manual test run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
