name: Desktop release

# Builds native installers for Windows (.exe/.msi), macOS (.dmg) and Linux (.deb/.rpm/.AppImage)
# on each platform's own runner (Tauri apps aren't reliably cross-compiled).
#
# - push a `v*` tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`): builds, signs, and publishes
#   a GitHub Release with the installers *and* the signed `latest.json` manifest the in-app
#   updater polls (src-tauri/tauri.conf.json's plugins.updater.endpoints). This is what makes
#   "check for updates" inside the app find and install the new version.
# - "Run workflow" from the Actions tab: build-only smoke test, no release, no signing. Installers
#   are attached to the run as downloadable artifacts (Summary tab) so it also works before the
#   signing secrets below are configured.
#
# One-time setup for the auto-updater to work (see docs/DESKTOP_RELEASES.md):
#   Settings → Secrets and variables → Actions → New repository secret
#     TAURI_SIGNING_PRIVATE_KEY          (the private half of src-tauri/updater.key)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the password chosen when it was generated)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      # Tag push: build, sign, and publish/update the GitHub Release the updater polls.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pokémon Team Builder ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Manual "Run workflow": build only, no signing, no release — just proves the pipeline works.
      - name: Build only (manual test run)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build

      - name: Upload build (manual test run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
