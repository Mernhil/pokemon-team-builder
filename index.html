<!doctype html>
<html lang="en" class="dark" data-look="sticker">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=%APP_VERSION%" />
    <!-- viewport-fit=cover: draw under the notch / Dynamic Island / home indicator; the layout
         keeps content clear with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser UI colour; src/App.tsx keeps it in step with the theme picked in Settings. -->
    <meta name="theme-color" content="#1c1f26" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Team Builder" />
    <!-- Full-screen status bar with white text; the header paints a dark band under it in the
         light theme so the clock and battery stay readable (see .status-band in index.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=%APP_VERSION%" />
    <!-- Launch screens, generated by `npm run splash` (scripts/build-splash.mjs). -->
    <link rel="apple-touch-startup-image" href="/splash/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
